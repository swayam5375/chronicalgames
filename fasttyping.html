<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Typing - ChronicalGames</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">ChronicalGames</div>
    <nav>
        <a href="/index.html">Home</a>
        <a href="/games.html">Games</a>
    </nav>
</header>

<div class="typing-container">

    <h1 style="margin-top: 40px;">⚡ Fast Typing Challenge ⚡</h1>

    <!-- Difficulty -->
    <div id="difficultySelect" class="options">
        <p>Select Difficulty:</p>

        <button onclick="setDifficulty('easy')">Easy 😀</button>
        <button onclick="setDifficulty('medium')">Medium 😎</button>
        <button onclick="setDifficulty('hard')">Hard 🔥</button>
    </div>

    <!-- Time -->
    <div id="timeSelect" class="options" style="display:none;">
        <p>Select Time:</p>

        <button onclick="startGame(20)">20 sec</button>
        <button onclick="startGame(30)">30 sec</button>
        <button onclick="startGame(60)">60 sec</button>
    </div>

    <!-- Game -->
    <div id="gameArea" style="display:none;">

        <div id="word">---</div>

        <input id="input" placeholder="Type here...">

        <div class="score-box">
            <div>Score: <span id="score">0</span></div>
            <div>High Score: <span id="highscore">0</span></div>
            <div>Time: <span id="time">0</span></div>
        </div>

    </div>

</div>

<button id="resetBtn">Reset Scores</button>

<!-- 🔥 MOST IMPORTANT FIX -->
<script src="/game.js"></script>

</body>
</html>
