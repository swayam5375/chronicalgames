<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChronicalGames - Home</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: 'Poppins', sans-serif;
            color: #fff;
            text-align: center;
        }

        h1 {
            font-size: 50px;
            margin-top: 40px;
            text-shadow: 0 0 10px #00fff2, 0 0 20px #00fff2;
        }

        h2 {
            font-size: 28px;
            margin-top: 10px;
            text-shadow: 0 0 10px #ff00d4, 0 0 20px #ff00d4;
        }

        .menu-box {
            margin-top: 50px;
        }

        .menu-btn {
            display: block;
            width: 260px;
            margin: 15px auto;
            padding: 15px;
            font-size: 22px;
            background: #111;
            border: 2px solid #00ffe5;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            text-shadow: 0 0 5px #00ffe5;
        }

        .menu-btn:hover {
            transform: scale(1.07);
            box-shadow: 0 0 15px #00ffe5;
        }

        .ai-popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
        }

        .ai-box {
            width: 350px;
            max-width: 90%;
            background: #111;
            border: 2px solid #0ff;
            border-radius: 10px;
            padding: 10px;
        }

        .ai-header {
            display: flex;
            justify-content: space-between;
            color: #0ff;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .chat-box {
            height: 250px;
            overflow-y: auto;
            text-align: left;
            padding: 5px;
        }

        .chat-input {
            display: flex;
            gap: 5px;
        }

        .chat-input input {
            flex: 1;
            padding: 8px;
        }

        .chat-input button {
            padding: 8px;
            background: #0ff;
            border: none;
            cursor: pointer;
        }

        .signature {
            position: fixed;
            bottom: 15px;
            width: 100%;
            text-align: center;
            font-size: 18px;
            color: #ff4dfc;
        }

        @media only screen and (max-width: 600px) {
            h1 { font-size: 32px; }
            h2 { font-size: 20px; }
            .menu-btn { width: 90%; font-size: 20px; }
        }
    </style>
</head>

<body>

    <h1>Chronicall</h1>
    <h2>Home • Games • AI</h2>

    <div class="menu-box">

        <button class="menu-btn" onclick="location.href='games.html'">
            🎮 Games
        </button>

        <button class="menu-btn" onclick="openAI()">
            🤖 AI Bot
        </button>

    </div>

    <div id="aiPopup" class="ai-popup">

        <div class="ai-box">

            <div class="ai-header">
                🤖 AI Assistant
                <span onclick="closeAI()" style="cursor:pointer;">❌</span>
            </div>

            <div id="chatBox" class="chat-box"></div>

            <div class="chat-input">
                <input type="text" id="userInput" placeholder="Ask anything...">
                <button onclick="sendMessage()">Send</button>
            </div>

        </div>

    </div>

    <div class="signature">Made with ❤️ by Swayam Sherekar</div>

<script>
function openAI() {
    document.getElementById("aiPopup").style.display = "flex";
}

function closeAI() {
    document.getElementById("aiPopup").style.display = "none";
}

async function sendMessage() {
    let input = document.getElementById("userInput").value;
    let chat = document.getElementById("chatBox");

    if(input.trim() === "") return;

    chat.innerHTML += `
<div style="text-align:right;">
  <span style="background:#0ff; color:#000; padding:8px 12px; border-radius:10px;">
    ${input}
  </span>
</div>`;

    let res = await fetch("http://localhost:3000/chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ message: input })
    });

    let data = await res.json();

    chat.innerHTML += "<p><b>AI:</b> " + data.reply + "</p>";

    document.getElementById("userInput").value = "";
    chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
