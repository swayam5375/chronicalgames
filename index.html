<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChronicalGames - Home</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: 'Poppins', sans-serif;
            color: #fff;
            text-align: center;
        }

        h1 {
            font-size: 50px;
            margin-top: 40px;
            text-shadow: 0 0 10px #00fff2, 0 0 20px #00fff2;
        }

        h2 {
            font-size: 28px;
            margin-top: 10px;
            text-shadow: 0 0 10px #ff00d4, 0 0 20px #ff00d4;
        }

        .menu-box {
            margin-top: 50px;
        }

        .menu-btn {
            display: block;
            width: 260px;
            margin: 15px auto;
            padding: 15px;
            font-size: 22px;
            background: #111;
            border: 2px solid #00ffe5;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            text-shadow: 0 0 5px #00ffe5;
        }

        .menu-btn:hover {
            transform: scale(1.07);
            box-shadow: 0 0 15px #00ffe5;
        }

        /* AI CHAT BOX */
        #aiBox {
            display: none;
            margin-top: 30px;
        }

        #chatBox {
            max-width: 400px;
            margin: auto;
            text-align: left;
        }

        input {
            padding: 10px;
            width: 70%;
            border-radius: 6px;
        }

        .signature {
            position: fixed;
            bottom: 15px;
            width: 100%;
            text-align: center;
            font-size: 18px;
            color: #ff4dfc;
        }

        @media only screen and (max-width: 600px) {
            h1 { font-size: 32px; }
            h2 { font-size: 20px; }
            .menu-btn { width: 90%; font-size: 20px; }
        }
    </style>
</head>

<body>

    <h1>Chronicall</h1>
    <h2>Home • Games • AI</h2>

    <div class="menu-box">

        <!-- 🎮 GAMES BUTTON -->
        <button class="menu-btn" onclick="location.href='games.html'">
            🎮 Games
        </button>

        <!-- 🤖 AI BOT BUTTON -->
        <button class="menu-btn" onclick="openAI()">
            🤖 AI Bot
        </button>

    </div>

    <!-- 🤖 AI CHAT -->
    <div id="aiBox">
        <h2>AI Assistant</h2>

        <div id="chatBox"></div>

        <input type="text" id="userInput" placeholder="Ask anything...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <div class="signature">Made with ❤️ by Swayam Sherekar</div>

<script>
function openAI() {
    document.getElementById("aiBox").style.display = "block";
}

/* TEMP FAKE AI (frontend only) */
function sendMessage() {
    let input = document.getElementById("userInput").value;

    let chat = document.getElementById("chatBox");

    chat.innerHTML += "<p><b>You:</b> " + input + "</p>";

    let reply = "I am an AI created by Swayam Sherekar 😎";

    chat.innerHTML += "<p><b>AI:</b> " + reply + "</p>";
}
</script>

</body>
</html>
